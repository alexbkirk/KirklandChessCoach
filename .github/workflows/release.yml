name: Release

# Publishing a release: set <Version> in Directory.Build.props, merge it, then push a tag that matches, e.g.
#   git tag v1.1.0
#   git push origin v1.1.0
# This builds ChessCoach-Setup.exe and attaches it, with its SHA-256, to a GitHub release. The app finds it from there.
# The build job can only read the repository; a separate job holds the write permission and only publishes the build's files.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # actions are pinned to commit SHAs (the version is in the comment)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag matches the app version and is on main
        shell: pwsh
        run: |
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<Version>(\d+\.\d+\.\d+)</Version>') { throw 'Directory.Build.props has no <Version>.' }
          if ($env:TAG -ne "v$($Matches[1])") { throw "Tag $env:TAG does not match Directory.Build.props version $($Matches[1])." }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:TAG is not on main, so it was not released." }

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      # the analysis tests run the Python scripts from analysis\.venv, as scripts\setup.ps1 builds it on a developer's machine
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Create the analysis environment
        run: |
          python -m venv analysis\.venv
          analysis\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r analysisequirements.txt

      - name: Run the tests
        run: dotnet test ChessCoach.sln -c Release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: ./tools/build-installer.ps1

      - name: Write the checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/ChessCoach-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ChessCoach-Setup.exe" | Set-Content -Path dist/ChessCoach-Setup.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer
          path: |
            dist/ChessCoach-Setup.exe
            dist/ChessCoach-Setup.exe.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer

      - name: Publish the release
        run: gh release create "$TAG" ChessCoach-Setup.exe ChessCoach-Setup.exe.sha256 --title "$TAG" --generate-notes
